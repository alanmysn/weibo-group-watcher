<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群消息面板</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #8a8f98;
    --accent: #1d9bf0; --border: #e4e6ea; --sys: #606770;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: rgba(255,255,255,.95);
    border-bottom: 1px solid var(--border);
  }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  #dot.online { background: #00ba7c; }
  #dot.reconnecting { background: #ffb020; animation: blink 1s infinite; }
  #dot.expired { background: #f4212e; }
  @keyframes blink { 50% { opacity: .3; } }
  #status-text { color: var(--muted); font-size: 13px; }
  #count { margin-left: auto; color: var(--muted); font-size: 13px; }
  .header-link { color: var(--muted); font-size: 13px; text-decoration: none; }
  .header-link:hover { color: var(--text); }
  button.header-link { border: 0; background: transparent; font-family: inherit; cursor: pointer; }
  #search-toggle {
    position: absolute; left: 50%; transform: translateX(-50%);
  }
  #search-panel {
    position: sticky; z-index: 8; padding: 8px;
    background: rgba(244,245,247,.96); border-bottom: 1px solid var(--border);
  }
  #search-panel[hidden] { display: none; }
  #search-form { display: flex; gap: 7px; max-width: 664px; margin: 0 auto; }
  #search-input {
    min-width: 0; flex: 1; padding: 8px 11px; border: 1px solid var(--border);
    border-radius: 9px; background: var(--card); color: var(--text);
    font: inherit; outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-form button {
    flex: none; padding: 7px 12px; border: 1px solid var(--border);
    border-radius: 9px; background: var(--card); color: var(--text);
    font: inherit; cursor: pointer;
  }
  #search-form button[type="submit"] {
    border-color: var(--accent); background: var(--accent); color: #fff;
  }
  #search-summary {
    max-width: 664px; margin: 6px auto 0; color: var(--muted); font-size: 13px;
  }
  main { max-width: 680px; margin: 0 auto; padding: 10px 8px 40px; }
  .msg {
    display: flex; gap: 10px; margin-bottom: 8px; padding: 12px 12px 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  }
  .msg.special { background: #fff9e8; border-left: 3px solid #e2a000; padding-left: 11px; }
  .avatar-wrap { flex: none; position: relative; width: 38px; height: 38px; }
  .avatar-letter {
    width: 100%; height: 100%; border-radius: 50%;
    background: #e8edf2; color: #5b6572;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
  }
  .avatar-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover;
  }
  .body { min-width: 0; flex: 1; }
  .name-row { display: flex; align-items: baseline; gap: 8px; }
  .name {
    border: 0; padding: 0; background: transparent; color: inherit;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .name:hover { color: var(--accent); }
  .time { color: var(--muted); font-size: 12.5px; }
  .content { margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .content a { color: var(--accent); text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .emoji-img { height: 1.3em; vertical-align: -0.25em; }
  .img-embed { display: block; max-width: 320px; border-radius: 10px; margin-top: 6px; }
  .media-placeholder { display: none; margin-top: 6px; color: var(--muted); font-size: 13px; }
  .attachment {
    margin-top: 6px; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 9px; background: #fafbfc;
  }
  .attachment-name { font-weight: 600; word-break: break-all; }
  .attachment-meta { margin-top: 3px; color: var(--muted); font-size: 12.5px; }
  .attachment a { margin-left: 8px; color: var(--accent); text-decoration: none; }
  .recall { color: #c00; font-size: 12.5px; }
  .sys {
    justify-content: center; margin-bottom: 4px; padding: 6px 14px;
    background: transparent; border: 0;
  }
  .sys .avatar-wrap { display: none; }
  .sys .name-row { display: none; }
  .sys .body { color: var(--sys); font-size: 13.5px; }
  .card {
    margin-top: 6px; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; display: block; text-decoration: none; color: inherit;
  }
  .card img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
  .card .card-body { padding: 8px 12px; }
  .card .card-title {
    font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .card-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .video-tag {
    display: inline-block; background: #eef3f8; color: #5b6572;
    border-radius: 6px; padding: 1px 8px; font-size: 12px; margin-bottom: 4px;
  }
  .loading { text-align: center; color: var(--muted); padding: 14px; font-size: 13px; }
  .sentinel { height: 1px; }
  .divider {
    text-align: center; color: var(--accent); font-size: 12.5px;
    padding: 10px 0; position: relative; margin: 4px 14px;
  }
  .divider::before, .divider::after {
    content: ''; position: absolute; top: 50%; width: 30%;
    border-top: 1px solid var(--accent); opacity: .45;
  }
  .divider::before { left: 0; } .divider::after { right: 0; }
  #unread-badge {
    margin-left: 8px; background: var(--accent); color: #fff;
    border: none; border-radius: 999px; padding: 3px 10px;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  #unread-badge:hover { filter: brightness(1.1); }
  #unread-badge.special { background: #d99000; }
  #gaps-bar {
    position: sticky; z-index: 9;
    padding: 8px 44px 8px 14px; font-size: 13px; color: #8a6d1a;
    background: #fff7e0; border-bottom: 1px solid #f0e2b6; display: none;
  }
  #gaps-bar .gap-item { margin: 2px 0; }
  #gaps-bar button {
    margin-left: 8px; border: 1px solid #d9b84a; background: #fff;
    color: #8a6d1a; border-radius: 6px; padding: 2px 10px;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  #gaps-bar button:disabled { opacity: .6; cursor: wait; }
  #gaps-bar button:hover:not(:disabled) { background: #fdf3d0; }
  #gaps-bar .gap-close {
    position: absolute; top: 5px; right: 8px; margin: 0; padding: 0 6px;
    border: 0; background: transparent; font-size: 20px; line-height: 26px;
  }
  #gaps-bar .gap-close:hover:not(:disabled) { background: transparent; color: #5f4a12; }
</style>
</head>
<body>
<header>
  <span id="dot"></span><span id="status-text">连接中…</span>
  <button id="unread-badge" hidden title="跳到最早待读处">待读 0</button>
  <button id="search-toggle" class="header-link" type="button" aria-expanded="false">搜索</button>
  <span id="count"></span>
  <a class="header-link" href="/gaps" target="_blank">遗漏记录</a>
  <a class="header-link" href="/settings" target="_blank">特别关注</a>
</header>
<div id="gaps-bar"></div>
<section id="search-panel" hidden>
  <form id="search-form">
    <input id="search-input" type="search" maxlength="100" placeholder="搜索消息" aria-label="搜索消息">
    <button type="submit">搜索</button>
    <button id="clear-search" type="button" hidden>返回</button>
  </form>
  <div id="search-summary" hidden></div>
</section>
<main id="feed">
  <div class="sentinel" id="sentinel"></div>
</main>

<script>
const feed = document.getElementById('feed');
const sentinel = document.getElementById('sentinel');
const dot = document.getElementById('dot');
const statusText = document.getElementById('status-text');
const countEl = document.getElementById('count');
const searchForm = document.getElementById('search-form');
const searchInput = document.getElementById('search-input');
const clearSearchButton = document.getElementById('clear-search');
const searchSummary = document.getElementById('search-summary');
const searchPanel = document.getElementById('search-panel');
const searchToggle = document.getElementById('search-toggle');
const headerEl = document.querySelector('header');
const gapsBar = document.getElementById('gaps-bar');

let oldestId = null;
let loading = false;
const seen = new Set();
let emojiMap = {};   // [短语] → /api/emoji/xxx
let lastReadId = null;  // 已读锚点（服务端为准，本地缓存用于分割线/上报）
let firstUnreadId = null;  // 服务端明确给出的当前第一条待读消息
let unread = 0;
let jumpingToUnread = false;
let initialPositioning = true;
let initialLoadDone = false;
let specialUids = new Set();
let attentionMode = false;
let specialQueue = [];
let searchQuery = '';
let filterUid = '';
let filterName = '';
let viewVersion = 0;

function isSearchMode() {
  return Boolean(searchQuery || filterUid);
}

function updateStickyOffsets() {
  gapsBar.style.top = `${headerEl.offsetHeight}px`;
  const gapHeight = gapsBar.offsetParent ? gapsBar.offsetHeight : 0;
  searchPanel.style.top = `${headerEl.offsetHeight + gapHeight}px`;
}

function setSearchPanel(open) {
  searchPanel.hidden = !open;
  searchToggle.setAttribute('aria-expanded', String(open));
  requestAnimationFrame(updateStickyOffsets);
  if (open) searchInput.focus();
}

searchToggle.addEventListener('click', () => setSearchPanel(searchPanel.hidden));
window.addEventListener('resize', updateStickyOffsets);

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const today = new Date().toDateString() === d.toDateString();
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return today ? hm : `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}

// [表情名] → 表情图
function renderEmoji(text) {
  const t = esc(text);
  if (!Object.keys(emojiMap).length) return t;
  return t.replace(/\[([^\]]+)\]/g, (m, name) => {
    const key = `[${name}]`;
    return emojiMap[key] ? `<img class="emoji-img" src="${emojiMap[key]}" alt="${esc(key)}">` : m;
  });
}

function avatarHtml(m) {
  if (!m.avatar_url) return `<div class="avatar-wrap"><div class="avatar-letter">${esc((m.from_name || '?').slice(0,1).toUpperCase())}</div></div>`;
  return `<div class="avatar-wrap"><div class="avatar-letter">${esc((m.from_name || '?').slice(0,1).toUpperCase())}</div>` +
         `<img class="avatar-img" src="/api/avatar/${encodeURIComponent(m.from_uid)}" loading="lazy" onerror="this.remove()"></div>`;
}

function cardHtml(m) {
  let uo;
  try { uo = JSON.parse(m.url_objects || '[]'); } catch (e) { uo = []; }
  const obj = (uo[0] || {});
  const status = obj.status || {};
  const info = obj.info || {};
  const title = status.text || m.content || '分享的微博';
  const author = (status.user || {}).screen_name || '';
  const link = info.url_short || obj.url_ori || m.content;
  const stats = [
    status.reposts_count != null ? `${status.reposts_count} 转发` : '',
    status.comments_count != null ? `${status.comments_count} 评论` : '',
    status.attitudes_count != null ? `${status.attitudes_count} 赞` : '',
  ].filter(Boolean).join(' · ');
  // 视频分享：封面留到第 7 步图片模块，先给标记占位
  const isVideo = !!(status.page_info && status.page_info.type === 'video')
                  || !!status.video_info;
  let img = '';
  if ((status.pic_ids || []).length) {
    img = `<img src="https://wx1.sinaimg.cn/thumbnail/${status.pic_ids[0]}.jpg" loading="lazy" onerror="this.remove()">`;
  }
  const videoTag = isVideo ? '<div class="video-tag">📹 视频分享（封面第 7 步接入）</div>' : '';
  return `<a class="card" href="${esc(link)}" target="_blank" rel="noopener">${img}<div class="card-body">` +
         `${videoTag}<div class="card-title">${renderEmoji(title)}</div>` +
         `<div class="card-meta">${esc([author, stats].filter(Boolean).join(' · '))}</div>` +
         `</div></a>`;
}

function formatBytes(bytes) {
  if (bytes == null) return '';
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

function attachmentHtml(m) {
  const name = m.attachment_name || m.content || '文件附件';
  return `<div class="attachment" id="attachment-${m.id}">` +
    `<div class="attachment-name">📎 ${esc(name)}</div>` +
    `<div class="attachment-meta">正在读取文件信息…</div></div>`;
}

async function loadAttachmentInfo(id, attempt = 0) {
  const el = document.getElementById(`attachment-${id}`);
  if (!el) return;
  try {
    const r = await fetch(`/api/attachment-info/${id}`);
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      el.querySelector('.attachment-meta').textContent = data.error || '附件信息读取失败';
      return;
    }
    const info = await r.json();
    el.querySelector('.attachment-name').textContent = `📎 ${info.file_name || '文件附件'}`;
    const meta = el.querySelector('.attachment-meta');
    const size = formatBytes(info.size_bytes);
    if (info.status === 'available') {
      meta.innerHTML = `${esc(size)}<a href="/api/attachment/${id}" download>下载</a>`;
    } else if (info.status === 'failed') {
      meta.innerHTML = `${esc(size)} · 下载失败<a href="/api/attachment/${id}" download>重试下载</a>`;
    } else if (info.status === 'unavailable') {
      meta.textContent = info.error || '历史附件尚未回填';
    } else {
      meta.textContent = `${size ? size + ' · ' : ''}正在读取文件信息…`;
      if (attempt < 3) setTimeout(() => loadAttachmentInfo(id, attempt + 1), 1000);
    }
  } catch (e) {}
}

function makeNode(m) {
  const div = document.createElement('div');
  div.dataset.id = m.id;   // 滚动已读检测用
  div.dataset.uid = m.from_uid || '';
  const isSys = m.type === 344;
  const isSpecial = specialUids.has(String(m.from_uid || ''));
  div.className = 'msg' + (isSys ? ' sys' : '') + (isSpecial ? ' special' : '');
  if (isSys) {
    div.innerHTML = `<div class="body">${esc(m.content)}</div>`;
    return div;
  }
  const name = m.from_name || '未知';
  let inner = `<div class="name-row"><button class="name" type="button">${esc(name)}</button>` +
              `<span class="time">${fmtTime(m.time)}</span></div>`;
  if (m.recall_status) {
    inner += `<div class="content recall">↩︎ ${renderEmoji(m.content)}（已撤回）</div>`;
  } else if (m.media_type === 1 || m.media_type === 15) {
    inner += `<div class="content">${renderEmoji(m.content)}</div>` +
             `<img class="img-embed" src="/api/image/${m.id}" loading="lazy" alt="图片" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">` +
             `<span class="media-placeholder">🖼️ 图片尚未缓存</span>`;
  } else if (m.media_type === 5) {
    inner += `<div class="content">${renderEmoji(m.content)}</div>` + attachmentHtml(m);
    setTimeout(() => loadAttachmentInfo(m.id), 0);
  } else if (m.media_type === 10) {
    inner += `<div class="content">${renderEmoji(m.content)}</div>` +
             `<div class="video-tag">📹 视频</div>` +
             `<img class="img-embed" src="/api/image/${m.id}" loading="lazy" alt="视频封面" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">` +
             `<span class="media-placeholder">视频封面尚未缓存</span>`;
  } else if (m.media_type === 14) {
    inner += `<div class="content">${renderEmoji(m.content)}</div>` + cardHtml(m);
  } else {
    inner += `<div class="content">${renderEmoji(m.content)}</div>`;
  }
  div.innerHTML = avatarHtml(m) + `<div class="body">${inner}</div>`;
  return div;
}

function findMessage(id) {
  return [...feed.querySelectorAll('.msg')]
    .find(el => Number(el.dataset.id) === Number(id)) || null;
}

function placeDividerBefore(id) {
  const msg = findMessage(id);
  if (!msg) return null;
  const old = document.getElementById('read-divider');
  if (old) old.remove();
  const d = document.createElement('div');
  d.className = 'divider';
  d.id = 'read-divider';
  d.textContent = '—— 上次看到这里 · 以下是新消息 ——';
  msg.before(d);
  return d;
}

function prependBatch(msgs) {
  const frag = document.createDocumentFragment();
  for (const m of msgs) {
    if (seen.has(m.id)) continue;
    seen.add(m.id);
    frag.appendChild(makeNode(m));
    if (oldestId === null || m.id < oldestId) oldestId = m.id;
  }
  sentinel.after(frag);
  if (firstUnreadId && !isSearchMode()) placeDividerBefore(firstUnreadId);
}

async function loadOlder() {
  if (loading) return;
  loading = true;
  const version = viewVersion;
  let keepTip = false;
  const tip = document.createElement('div');
  tip.className = 'loading'; tip.textContent = '加载中…';
  feed.appendChild(tip);
  try {
    const params = new URLSearchParams({ limit: '50' });
    if (oldestId) params.set('before', oldestId);
    if (searchQuery) params.set('q', searchQuery);
    if (filterUid) params.set('uid', filterUid);
    const url = `/api/messages?${params}`;
    const data = await (await fetch(url)).json();
    if (version !== viewVersion) return;
    tip.remove();
    if (!data.messages.length && oldestId === null) {
      tip.textContent = isSearchMode() ? '没有找到匹配消息' : '还没有消息，等第一条进来说话';
      feed.appendChild(tip);
      keepTip = true;
      return;
    }
    prependBatch(data.messages);
    if (!data.has_more && oldestId !== null) {
      const end = document.createElement('div');
      end.className = 'loading';
      end.textContent = isSearchMode() ? '—— 已显示全部匹配消息 ——' : '—— 已经到最初的消息 ——';
      sentinel.after(end);
      oldestId = 'done';
    }
  } catch (e) {
    tip.textContent = '加载失败，稍后自动重试';
    setTimeout(() => { tip.remove(); loadOlder(); }, 3000);
  } finally {
    if (!keepTip && tip.parentNode) tip.remove();
    loading = false;
  }
}

const io = new IntersectionObserver((entries) => {
  if (initialLoadDone && entries[0].isIntersecting && oldestId !== 'done') {
    loadOlder();
  }
}, { rootMargin: '200px' });
io.observe(sentinel);

async function pollGaps() {
  try {
    const d = await (await fetch('/api/gaps')).json();
    const gap = d.latest;
    if (!gap) {
      gapsBar.style.display = 'none'; gapsBar.innerHTML = '';
      updateStickyOffsets();
      return;
    }
    const start = fmtTime(gap.start_ts);
    const end = gap.end_ts ? fmtTime(gap.end_ts) : '现在（休眠中）';
    gapsBar.style.display = 'block';
    gapsBar.innerHTML = `<button class="gap-close" title="关闭这条提醒" aria-label="关闭这条提醒">×</button>` +
      `<div class="gap-item">⏸ 工具休眠 ${start} ~ ${end}，期间消息未采集</div>`;
    updateStickyOffsets();
    gapsBar.querySelector('.gap-close').addEventListener('click', async () => {
      try {
        const r = await fetch(`/api/gaps/${gap.id}/dismiss`, { method: 'POST' });
        if (r.ok) {
          gapsBar.style.display = 'none'; gapsBar.innerHTML = '';
          updateStickyOffsets();
        }
      } catch (e) {}
    });
  } catch (e) {}
}

async function pollState() {
  try {
    const s = await (await fetch('/api/state')).json();
    dot.className = '';
    if (s.status) dot.classList.add(s.status);
    const map = { online: '在线 · 实时监听中', reconnecting: '重连中…',
                  expired: '钥匙过期，需重新扫码', stopped: '已停止' };
    statusText.textContent = map[s.status] || s.status || '未知';
    if (s.stored_total) countEl.textContent = `共 ${s.stored_total} 条`;
    if (s.unread != null) { unread = s.unread; updateBadge(); }
    if (s.last_read_id != null) lastReadId = s.last_read_id;
    firstUnreadId = s.first_unread_id ?? null;
  } catch (e) { statusText.textContent = '服务未响应'; }
}
setInterval(pollState, 5000);
setInterval(pollGaps, 10000);
pollState();
pollGaps();

const badgeEl = document.getElementById('unread-badge');

function updateBadge() {
  if (isSearchMode()) {
    badgeEl.hidden = true;
    return;
  }
  const n = attentionMode ? specialQueue.length : unread;
  badgeEl.hidden = n <= 0;
  badgeEl.classList.toggle('special', attentionMode);
  badgeEl.textContent = attentionMode ? `★ 特别 ${n}` : `待读 ${n}`;
  badgeEl.title = attentionMode ? '跳到下一条特别关注消息' : '跳到最早待读处';
}

function markSpecialsThrough(id) {
  if (!attentionMode) return;
  specialQueue = specialQueue.filter(mid => mid > id);
  updateBadge();
}

async function loadSpecialUsers() {
  try {
    const data = await (await fetch('/api/special-users')).json();
    specialUids = new Set((data.special_uids || []).map(String));
    for (const el of feed.querySelectorAll('.msg')) {
      el.classList.toggle('special', specialUids.has(el.dataset.uid));
    }
    if (attentionMode) {
      specialQueue = specialQueue.filter(id => {
        const msg = findMessage(id);
        return !msg || specialUids.has(msg.dataset.uid);
      });
      updateBadge();
    }
  } catch (e) {}
}

// 上报已读：视野内最新一条消息的 ID（防抖）
let readTimer = null;
function reportRead(id) {
  if (isSearchMode() || initialPositioning || jumpingToUnread || !id
      || (lastReadId && id <= lastReadId)) return;
  clearTimeout(readTimer);
  readTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
      const d = await r.json();
      if (d.unread != null) {
        unread = d.unread; lastReadId = id;
        markSpecialsThrough(id); updateBadge();
      }
    } catch (e) {}
  }, 400);
}

// 滚动即已读：向上翻历史/向下看新消息，视野内最新一条上报
let scrollTimer = null;
window.addEventListener('scroll', () => {
  if (initialPositioning) return;
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    let maxVisible = 0;
    for (const el of feed.querySelectorAll('.msg')) {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) {
        const id = Number(el.dataset.id || 0);
        if (id > maxVisible) maxVisible = id;
      }
    }
    if (maxVisible) reportRead(maxVisible);
  }, 150);
}, { passive: true });

async function enterUnreadMode() {
  jumpingToUnread = true;
  try {
    const s = await (await fetch('/api/state')).json();
    const targetId = s.first_unread_id;
    if (!targetId) {
      unread = 0; updateBadge(); return;
    }
    const special = await (await fetch('/api/special-unread')).json();
    specialQueue = (special.ids || []).map(Number);
    let msg = findMessage(targetId);
    while (!msg && oldestId !== 'done') {
      if (loading) {
        await new Promise(resolve => setTimeout(resolve, 100));
      } else {
        await loadOlder();
      }
      msg = findMessage(targetId);
    }
    if (!msg) return;  // 找不到时留在原处，绝不再跳到最顶部
    const div = placeDividerBefore(targetId);
    if (div) div.scrollIntoView({ block: 'start' });
    attentionMode = true;
    markSpecialsThrough(targetId);  // 第一条待读若正是特别消息，已进入视野
    updateBadge();
  } finally {
    setTimeout(() => { jumpingToUnread = false; }, 500);
  }
}

async function jumpNextSpecial() {
  if (!specialQueue.length) { updateBadge(); return; }
  const targetId = specialQueue[0];
  const msg = findMessage(targetId);
  if (!msg) return;
  jumpingToUnread = true;
  msg.scrollIntoView({ block: 'center' });
  specialQueue = specialQueue.filter(id => id > targetId);
  updateBadge();
  setTimeout(() => {
    jumpingToUnread = false;
    reportRead(targetId);  // 用户已确认：跨过的普通消息一并计已读
  }, 500);
}

badgeEl.addEventListener('click', () => {
  if (jumpingToUnread) return;
  if (attentionMode) jumpNextSpecial();
  else enterUnreadMode();
});

async function loadEmojis() {
  try { emojiMap = await (await fetch('/api/emojis')).json(); } catch (e) {}
}
loadEmojis();
setInterval(loadSpecialUsers, 30000);

async function showFilteredMessages() {
  setSearchPanel(true);
  viewVersion += 1;
  while (loading) {
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  for (const el of [...feed.children]) {
    if (el !== sentinel) el.remove();
  }
  seen.clear();
  oldestId = null;
  searchSummary.hidden = false;
  searchSummary.textContent = [
    searchQuery ? `关键词：${searchQuery}` : '',
    filterUid ? `发言人：${filterName || filterUid}` : '',
  ].filter(Boolean).join(' · ');
  clearSearchButton.hidden = false;
  updateBadge();
  await loadOlder();
  window.scrollTo({ top: document.documentElement.scrollHeight });
}

searchForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const query = searchInput.value.trim();
  if (!query) return;
  searchQuery = query;
  filterUid = '';
  filterName = '';
  await showFilteredMessages();
});

feed.addEventListener('click', async (event) => {
  const button = event.target.closest('.name');
  const message = button && button.closest('.msg');
  if (!message || !message.dataset.uid) return;
  searchQuery = '';
  searchInput.value = '';
  filterUid = message.dataset.uid;
  filterName = button.textContent;
  await showFilteredMessages();
});

clearSearchButton.addEventListener('click', () => location.reload());

const es = new EventSource('/api/stream');
es.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  // 控制类事件：补漏完成 → 提示并刷新
  if (m.type === 'backfill_done') {
    const bar = document.getElementById('gaps-bar');
    bar.style.display = 'block';
    bar.innerHTML = `<div class="gap-item">${m.complete ? '✅ 补漏完成' : '⚠️ 补漏未完成'}，新增 ${m.inserted} 条，正在刷新…</div>`;
    setTimeout(() => location.reload(), 1500);
    return;
  }
  if (isSearchMode()) return;
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 300;
  feed.appendChild(makeNode(m));
  if (attentionMode && !nearBottom
      && specialUids.has(String(m.from_uid || ''))
      && !specialQueue.includes(Number(m.id))) {
    specialQueue.push(Number(m.id));
    specialQueue.sort((a, b) => a - b);
    updateBadge();
  }
  if (nearBottom) {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    reportRead(m.id);  // 停在底部时新消息即计已读
  }
};

(async () => {
  await loadSpecialUsers();
  await pollState();      // 先拿已读锚点 → 首次渲染才能画出分割线
  await loadOlder();
  // 首页始终展示最新消息；这次程序自动滚动不算用户阅读。
  window.scrollTo({ top: document.documentElement.scrollHeight });
  setTimeout(() => {
    initialPositioning = false;
    initialLoadDone = true;
  }, 500);
})();
</script>

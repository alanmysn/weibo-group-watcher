<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/app.webmanifest">
<link rel="icon" href="/app-icon-192.png">
<title>特别关注设置</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1e21; --muted:#8a8f98; --border:#e4e6ea; --gold:#d99000; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { position:sticky; top:0; padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); background:rgba(255,255,255,.96); border-bottom:1px solid var(--border); }
  h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:680px; margin:0 auto; padding:8px env(safe-area-inset-right) calc(30px + env(safe-area-inset-bottom)) env(safe-area-inset-left); }
  .section-title { padding:12px 14px 7px; color:var(--muted); font-size:13px; font-weight:600; }
  .user { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--border); }
  .special-group .user { background:#fff9e8; border-left:3px solid var(--gold); padding-left:11px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#e8edf2; object-fit:cover; }
  .name { flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { flex:none; min-width:58px; height:34px; padding:0 10px; border:0; border-radius:8px; background:#eef1f4; color:#5f6873; font-family:inherit; cursor:pointer; }
  button.on { background:#fff0bd; color:#8a6100; }
  button:disabled { opacity:.55; cursor:wait; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  @media (max-width:520px) { button { min-height:40px; } }
</style>
</head>
<body>
<header>
  <h1>特别关注</h1>
  <p>按用户 UID 识别，改昵称后仍是同一个人。</p>
</header>
<main>
  <section id="users"><div class="empty">加载中…</div></section>
</main>
<script>
const usersEl = document.getElementById('users');

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function userHtml(user) {
  const active = user.special;
  return `<div class="user"><img class="avatar" src="/api/avatar/${encodeURIComponent(user.uid)}" onerror="this.style.visibility='hidden'">` +
    `<div class="name">${esc(user.name || '未知')}</div>` +
    `<button class="${active ? 'on' : ''}" data-uid="${esc(user.uid)}" data-on="${active ? '1' : '0'}" title="${active ? '取消特别关注' : '设为特别关注'}">${active ? '取消' : '☆ 关注'}</button></div>`;
}

async function loadUsers() {
  try {
    const data = await (await fetch('/api/special-users')).json();
    if (!data.users.length) {
      usersEl.innerHTML = '<div class="empty">还没有可设置的发言人</div>';
      return;
    }
    const sorted = [...data.users].sort((a, b) =>
      (a.name || '').localeCompare(b.name || '', 'zh-CN', {
        sensitivity:'base', numeric:true,
      })
    );
    const special = sorted.filter(user => user.special);
    const others = sorted.filter(user => !user.special);
    const specialHtml = special.length
      ? `<section class="special-group"><div class="section-title">已特别关注（${special.length}）</div>${special.map(userHtml).join('')}</section>`
      : '';
    const othersHtml = others.length
      ? `<section><div class="section-title">其他已记录用户（${others.length}）</div>${others.map(userHtml).join('')}</section>`
      : '';
    usersEl.innerHTML = specialHtml + othersHtml;
  } catch (e) {
    usersEl.innerHTML = '<div class="empty">加载失败，请稍后刷新</div>';
  }
}

usersEl.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-uid]');
  if (!btn) return;
  const enabled = btn.dataset.on !== '1';
  btn.disabled = true;
  try {
    const r = await fetch('/api/special-users', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({uid:btn.dataset.uid, enabled}),
    });
    if (!r.ok) throw new Error('save failed');
    await loadUsers();
  } finally {
    btn.disabled = false;
  }
});

loadUsers();
</script>
</body>
</html>
